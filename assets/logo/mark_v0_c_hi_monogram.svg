<?xml version="1.0" encoding="UTF-8"?>
<!--
  ひだまりこそだち ロゴマーク v0 案C
  コンセプト: 「ひ」のモノグラム / Stylized Hi-character
  - ひらがな「ひ」をモチーフに、左の点を太陽、右下の払いを葉/芽に見立てた抽象造形
  - 最も抽象的でブランド独自性が高い案
  - シンプルなぶん、SNS アイコンの小サイズでも視認性が高い
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景: クリーム -->
  <rect width="512" height="512" fill="#FFFAF0"/>

  <!-- 太陽の円（「ひ」の点に相当、左上） -->
  <circle cx="180" cy="200" r="48" fill="#FFC857"/>
  <circle cx="180" cy="200" r="56" fill="none" stroke="#FFAB76" stroke-width="2" opacity="0.4"/>

  <!-- 「ひ」の本体（右側の弓形ストローク、暖色のブラウン系） -->
  <!-- 上部のカーブ -->
  <path d="M 240 200
           Q 320 130 380 240
           Q 360 300 280 350
           Q 220 380 170 350
           Q 200 320 260 320
           Q 320 320 340 280
           Q 340 240 290 220
           Q 250 215 240 230 Z"
        fill="#C9966A" opacity="0.85"/>

  <!-- 葉のアクセント（「ひ」の右下の払いの位置に、芽の象徴） -->
  <g transform="translate(310, 330) rotate(15)">
    <path d="M 0 0 Q -8 -16 8 -22 Q 18 -10 0 0 Z" fill="#7AA77A"/>
    <path d="M 8 -8 Q 22 -14 28 -4 Q 18 4 8 -8 Z" fill="#A4C293"/>
  </g>

  <!-- ベースの地面（薄い陰影） -->
  <ellipse cx="256" cy="400" rx="120" ry="6" fill="#E8DDB5" opacity="0.45"/>
</svg>
